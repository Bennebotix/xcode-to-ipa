name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Clone and Build IPA
    runs-on: xcode-27

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Read Git URL and Clone Target Repository
        run: |
          TARGET_URL=$(cat repo_url.txt | tr -d '\n' | tr -d '\r')
          echo "Cloning $TARGET_URL..."
          git clone "$TARGET_URL" target_app
          
      - name: Build the Xcode Project
        run: |
          cd target_app
          
          XCODEPROJ=$(ls -1d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          
          echo "Building project: $XCODEPROJ with scheme: $SCHEME_NAME"
          
          xcodebuild clean archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO
            
      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qr app.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-App-IPA
          path: app.ipa
          retention-days: 7
